```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dodge Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0 10px;
        }

        #gameCanvas {
            background: #111;
            border: 2px solid white;
        }

        #info {
            width: 600px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 18px;
        }

        #gameOver {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .description {
            margin-top: 10px;
            color: #bbb;
        }
    </style>
</head>

<body>

    <h1>🎮 Dodge Game</h1>
    <!-- HTML5 Canvas라는 게임 화면을 만드는 영역 -->
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="info">
        <div>점수: <span id="score">0</span></div>
        <div>← → 이동</div>
    </div>

    <div id="gameOver"></div>

    <div class="description">
        적을 피하세요! Game Over 후 R 키를 누르면 재시작됩니다.
    </div>

    <script src="game.js"></script>

</body>
</html>
```
